spring.application.name=lowloot-server
spring.config.import=optional:classpath:application-local.properties

# La base `lowloot` ya tenia tablas creadas a mano (users, wallets,
# transactions, user_games, wishlist, games...) antes de que este proyecto
# usara Flyway. baseline-on-migrate hace que Flyway trate ese estado actual
# como si ya estuviera en baseline-version, y a partir de ahi solo corre
# migraciones nuevas (V2 en adelante) sin tocar ni recrear lo que ya existe.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=esquema existente antes de Flyway

# Nunca dejamos que Hibernate cree/altere tablas solo: valida que las
# entidades coincidan con la base real y falla el arranque si no calzan,
# en vez de arriesgarse a modificar datos de produccion.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Por defecto Spring Boot omite el campo "message" del cuerpo de error JSON
# (queda solo "error"/"status"). Sin esto, mensajes como "Saldo
# insuficiente" o "Ya tenés este juego" nunca llegaban al launcher y el
# frontend mostraba un mensaje genérico en su lugar. El stacktrace se deja
# apagado igual (nunca se manda al cliente).
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Secreto de firma de JWT. Sobreescribir en application-local.properties
# (no commitear el valor real). Duracion del token en milisegundos.
lowloot.jwt.secret=change-me-in-application-local-properties-please-use-a-long-random-value
lowloot.jwt.expiration-ms=604800000